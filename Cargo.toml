[package]
name = "gray-mastodon"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
description = "mastodon plugin for the gray agent harness"
license = "MIT"
[lib]
name = "mastodon_plugin"
path = "src/lib.rs"
[[bin]]
name = "mastodon"
path = "src/main.rs"
[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }
